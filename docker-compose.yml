# Local infra only. Apps run on the host via `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pixelforge
      POSTGRES_PASSWORD: pixelforge
      POSTGRES_DB: pixelforge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelforge"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # S3-compatible storage. MinIO no longer publishes public images; SeaweedFS (Apache-2.0) replaces it.
  # No identities configured = auth disabled, which is fine for local dev only.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -ip=s3 -ip.bind=0.0.0.0
    ports: ["8333:8333"]
    volumes: [s3data:/data]

  s3-init:
    image: chrislusf/seaweedfs:latest
    depends_on: [s3]
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 5
        echo "s3.bucket.create -name pixelforge-uploads" | weed shell -master=s3:9333
        echo "s3.bucket.create -name pixelforge-public" | weed shell -master=s3:9333

volumes:
  pgdata:
  s3data:
